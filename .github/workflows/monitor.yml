name: Monitor — Jornada Brasil

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:           # permite rodar manualmente pelo GitHub

permissions:
  contents: read
  actions: write   # usado só pelo passo que mantém o agendamento ligado

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # O GitHub desliga agendamentos de repositórios sem commits há 60 dias.
      # Reativar o workflow a cada execução zera essa contagem.
      - name: Manter o agendamento ligado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/monitor.yml/enable

      - uses: actions/checkout@v4

      # Confere todas as páginas do sitemap.xml + páginas fora dele + CSS/JS principais.
      # Se algo falhar, este passo falha, o job fica vermelho e o GitHub manda o e-mail de falha.
      - name: Verificar todas as páginas
        id: check
        run: bash tools/monitor.sh

      - name: Ver se o e-mail próprio está configurado
        id: email
        if: failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Segredos MAIL_USERNAME/MAIL_PASSWORD não configurados: o aviso chega pelo e-mail de falha do próprio GitHub."
          fi

      - name: Enviar e-mail de alerta
        if: failure() && steps.email.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ ALERTA Jornada Brasil — Páginas com erro detectadas"
          to: douglastassinarii@gmail.com
          from: "Jornada Brasil Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Olá Douglas,

            O monitoramento automático do Jornada Brasil detectou erros em uma ou mais páginas.

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            PÁGINAS COM ERRO:
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            ${{ steps.check.outputs.details }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Resumo: ${{ steps.check.outputs.summary }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            Acesse o site: https://jornadabrasil.com.br
            Ver esta execução: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — Monitor automático Jornada Brasil
